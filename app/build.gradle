plugins { id 'com.android.application' }
android {
    namespace 'es.castanon.penguinpush'
    compileSdk 36
    defaultConfig {
        applicationId 'es.castanon.penguinpush'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
